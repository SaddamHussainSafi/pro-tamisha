[project]
name = "pro-trading-api"
version = "0.1.0"
description = "Pro Trading API (Tamisha Trading Inc.) — Module 00 foundation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "cryptography>=43",
  "redis>=5.0",
  "celery>=5.4",
  "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pro_trading"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"tests/test_invoicing.py" = ["S105", "S106", "F811"]  # pytest fixtures re-used from test_orders
"migrations/*" = ["E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
packages = ["pro_trading"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["celery.*", "pyotp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
