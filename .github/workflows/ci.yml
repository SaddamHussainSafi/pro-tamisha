name: ci
on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tami
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: tami_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tami" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check src tests migrations scripts
      - run: uv run ruff format --check src tests migrations scripts
      - run: uv run mypy
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tami
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: tami
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tami" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Migrate API database
        working-directory: apps/api
        run: uv sync --frozen && uv run alembic upgrade head
      - name: Web checks
        working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Playwright smoke
        working-directory: apps/web
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/screenshots
